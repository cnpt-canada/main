<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Studio — cnpt</title>
<link rel="stylesheet" href="/app/app.css">
<script type="module" src="/app/admin.js"></script>
</head>
<body class="console">
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="side-top">
      <a class="side-brand" href="/" aria-label="cnpt home"><svg class="wm" viewBox="0 0 140 32" aria-hidden="true"><use href="/app/icons.svg#cnpt"/></svg></a>
      <span class="side-tag">studio</span>
      <button class="icon-btn side-close" id="side-close" type="button" aria-label="Close navigation"><svg class="ic" aria-hidden="true"><use href="/app/icons.svg#x"/></svg></button>
    </div>
    <nav class="side-nav" id="side-nav" aria-label="Sections"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="nav-scrim" id="nav-scrim"></div>

  <div class="stage">
    <header class="bar">
      <button class="icon-btn bar-menu" id="menu" type="button" aria-label="Open navigation" aria-controls="side" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="/app/icons.svg#menu"/></svg></button>
      <nav class="crumbs" aria-label="Breadcrumb"><span>Studio</span><span class="crumb-sep" aria-hidden="true">/</span><span id="crumb-view" aria-current="page">Enquiries</span></nav>
    </header>

    <main class="main" id="main">
      <section class="view" id="view-enquiries" aria-labelledby="enquiries-h">
        <div class="view-head">
          <div>
            <h1 id="enquiries-h">Enquiries</h1>
            <p class="view-sub">Everything sent through the contact form on cnpt.ca.</p>
          </div>
          <button class="btn btn-line btn-sm" id="refresh" type="button"><svg class="ic" aria-hidden="true"><use href="/app/icons.svg#refresh"/></svg>Refresh</button>
        </div>
        <div class="toolbar">
          <div class="seg" id="f-status" role="group" aria-label="Filter by status"></div>
          <label class="search"><span class="sr-only">Search enquiries</span><svg class="ic" aria-hidden="true"><use href="/app/icons.svg#search"/></svg><input class="input" id="f-text" type="search" placeholder="Search email, name or message" autocomplete="off"></label>
          <select class="select" id="f-stage" aria-label="Filter by stage"><option value="">All stages</option></select>
          <span class="meta" id="enquiries-meta"></span>
        </div>
        <div class="split">
          <div class="table-card" id="enquiry-table"><p class="loading">Loading…</p></div>
          <aside class="detail" id="detail" aria-label="Enquiry details" hidden></aside>
        </div>
      </section>

      <section class="view" id="view-members" aria-labelledby="members-h" hidden>
        <div class="view-head">
          <div>
            <h1 id="members-h">Members</h1>
            <p class="view-sub">Everyone who has signed in with Google. Owners come from ADMIN_EMAILS and always keep admin access.</p>
          </div>
        </div>
        <div class="toolbar">
          <div class="seg" id="f-role" role="group" aria-label="Filter by role"></div>
          <label class="search"><span class="sr-only">Search members</span><svg class="ic" aria-hidden="true"><use href="/app/icons.svg#search"/></svg><input class="input" id="m-text" type="search" placeholder="Search name or email" autocomplete="off"></label>
          <span class="meta" id="members-meta"></span>
        </div>
        <div class="table-card" id="member-table"><p class="loading">Loading…</p></div>
      </section>
    </main>
  </div>
</div>
<div class="detail-scrim" id="detail-scrim" hidden></div>
</body>
</html>
